<!doctype html>
<html lang="zh-CN">
<head>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<script src="series-workspace.js" data-plugin="astrbot_plugin_visual_media" data-view="workshop"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-series-text="视觉工坊">视觉工坊</title>
  <link rel="stylesheet" href="workshop.css">
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="home-layout.css">
  <link rel="stylesheet" href="shared/media-ui.css">
  <link rel="stylesheet" href="./series-ui.css?v=round2.1">
  <script type="module" src="./series-panels.js?v=round2.1"></script>
  <script src="./media-i18n.js?v=aligned.2"></script>
</head>
<body data-workshop-page="home">
<section id="dynamics-series-panel" aria-label="互通插件状态" data-series-aria-label="互通插件状态"><p class="sp-feedback" role="status" data-series-text="正在读取互通插件…">正在读取互通插件…</p></section>
<script src="shared/shell.js?v=world.2"></script>
<main id="workspace" tabindex="-1">
  <header class="hero series-heading">
    <div>
      <div class="eyebrow">VISUAL MEDIA / WORKSPACE</div>
      <h1 id="page-title" data-series-text="工坊总览">工坊总览</h1>
      <p id="page-description" data-series-text="查看运行状态，管理角色形象与最近的创作。">查看运行状态，管理角色形象与最近的创作。</p>
    </div>
    <a class="primary" href="studio/index.html"><span data-series-text="＋ 新建创作">＋ 新建创作</span></a>
  </header>
  <div id="notice" role="status" aria-live="polite"></div>
  <section class="stats" aria-label="运行概况" data-series-aria-label="运行概况">
    <article><span data-series-text="表情收藏">表情收藏</span><strong id="meme-count" class="tabular-nums">—</strong></article>
    <article><span data-series-text="角色形象">角色形象</span><strong id="profile-count" class="tabular-nums">—</strong></article>
    <article><span data-series-text="生成服务">生成服务</span><strong id="generation-state" data-series-text="正在连接">正在连接</strong></article>
    <article><span data-series-text="执行 / 排队">执行 / 排队</span><strong id="queue-count" class="tabular-nums">—</strong></article>
  </section>
  <section id="task-section"><div data-task-cards data-task-size="4" data-task-compact="true"></div></section>
  <section id="characters-section">
    <div class="section-head">
      <div>
        <h2><span data-series-text="角色形象">角色形象</span> <span id="profile-result-count" class="count-badge tabular-nums"></span></h2>
        <p data-series-text="统一外观、画风与参考图，让每次角色创作保持一致。">统一外观、画风与参考图，让每次角色创作保持一致。</p>
      </div>
      <button id="new-profile" type="button" data-series-text="＋ 新建角色">＋ 新建角色</button>
    </div>
    <div class="profile-toolbar">
      <label for="profile-search" class="sr-only" data-series-text="搜索角色">搜索角色</label>
      <input id="profile-search" type="search" placeholder="搜索角色名称、标识或外观…" data-series-placeholder="搜索角色名称、标识或外观…">
      <a id="all-profiles" href="index.html?section=characters" data-series-text="管理全部角色 →">管理全部角色 →</a>
    </div>
    <div id="profiles" class="profiles"></div>
  </section>
  <section id="history-section">
    <div class="section-head">
      <div>
        <h2 data-series-text="最近生成">最近生成</h2>
        <p data-series-text="收藏为表情后，可在聊天中检索和复用。点击缩略图可打开灯箱预览或带入创作台重绘。">收藏为表情后，可在聊天中检索和复用。点击缩略图可打开灯箱预览或带入创作台重绘。</p>
      </div>
      <button id="refresh" type="button" data-series-text="刷新">刷新</button>
    </div>
    <div id="history" class="gallery" aria-busy="true">
      <article class="image-card is-skeleton" aria-hidden="true"><div class="vm-card-media is-loading"></div><div class="details"><div class="vm-skeleton vm-skeleton-line"></div><div class="vm-skeleton vm-skeleton-btn"></div></div></article>
      <article class="image-card is-skeleton" aria-hidden="true"><div class="vm-card-media is-loading"></div><div class="details"><div class="vm-skeleton vm-skeleton-line"></div><div class="vm-skeleton vm-skeleton-btn"></div></div></article>
      <article class="image-card is-skeleton" aria-hidden="true"><div class="vm-card-media is-loading"></div><div class="details"><div class="vm-skeleton vm-skeleton-line"></div><div class="vm-skeleton vm-skeleton-btn"></div></div></article>
      <article class="image-card is-skeleton" aria-hidden="true"><div class="vm-card-media is-loading"></div><div class="details"><div class="vm-skeleton vm-skeleton-line"></div><div class="vm-skeleton vm-skeleton-btn"></div></div></article>
    </div>
  </section>
</main>
<dialog id="lightbox-dialog" class="vm-lightbox-dialog" aria-labelledby="lightbox-dialog-title">
  <div class="vm-lightbox-shell">
    <div class="vm-lightbox-stage">
      <img id="lightbox-preview-img" alt="" hidden>
      <p id="lightbox-preview-status" role="status"></p>
      <button type="button" id="lightbox-retry" data-series-text="重试" hidden>重试</button>
    </div>
    <div class="vm-lightbox-inspector">
      <div class="dialog-head">
        <h2 id="lightbox-dialog-title" data-series-text="作品详情">作品详情</h2>
        <button type="button" data-close="lightbox-dialog" aria-label="关闭" data-series-aria-label="关闭">×</button>
      </div>
      <div id="lightbox-preview-meta" class="vm-lightbox-meta"></div>
      <p id="lightbox-preview-prompt" class="vm-lightbox-prompt"></p>
      <div class="vm-lightbox-actions">
        <a id="lightbox-remix-link" class="primary" href="studio/index.html" data-series-text="带入创作台重绘">带入创作台重绘</a>
        <button type="button" id="lightbox-save-meme" data-series-text="收藏为表情">收藏为表情</button>
      </div>
    </div>
  </div>
</dialog>
<dialog id="profile-dialog" aria-labelledby="profile-dialog-title">
  <form id="profile-form">
    <div class="dialog-head">
      <h2 id="profile-dialog-title" data-series-text="角色形象">角色形象</h2>
      <button type="button" data-close="profile-dialog" aria-label="关闭" data-series-aria-label="关闭">×</button>
    </div>
    <label><span data-series-text="角色标识">角色标识</span><input name="key" required maxlength="64" placeholder="例如 anan" data-series-placeholder="例如 anan"></label>
    <label><span data-series-text="显示名称">显示名称</span><input name="name" maxlength="80" placeholder="夏目安安"></label>
    <label><span data-series-text="外观设定">外观设定</span><textarea name="appearance" rows="3" maxlength="4000" placeholder="发型、发色、服装，以及需要保持一致的细节" data-series-placeholder="发型、发色、服装，以及需要保持一致的细节"></textarea></label>
    <label><span data-series-text="画风">画风</span><textarea name="style" rows="2" maxlength="2000" placeholder="例如柔和色彩、简洁背景" data-series-placeholder="例如柔和色彩、简洁背景"></textarea></label>
    <fieldset class="vm-reference-field">
      <legend data-series-text="角色参考图">角色参考图</legend>
      <select name="references" multiple hidden aria-hidden="true"></select>
      <div id="reference-picker"></div>
    </fieldset>
    <footer>
      <button type="button" data-close="profile-dialog" data-series-text="取消">取消</button>
      <button class="primary" type="submit" data-series-text="保存角色">保存角色</button>
    </footer>
  </form>
</dialog>
<dialog id="save-dialog" aria-labelledby="save-dialog-title">
  <form id="save-form">
    <div class="dialog-head">
      <h2 id="save-dialog-title" data-series-text="收藏为表情">收藏为表情</h2>
      <button type="button" data-close="save-dialog" aria-label="关闭" data-series-aria-label="关闭">×</button>
    </div>
    <input type="hidden" name="generation_id">
    <input type="hidden" name="image_index">
    <label><span data-series-text="描述">描述</span><input name="description" maxlength="2000" placeholder="以后可以用这段描述找到它" data-series-placeholder="以后可以用这段描述找到它"></label>
    <label><span data-series-text="角色">角色</span><select name="character"><option value="" data-series-text="不指定角色">不指定角色</option></select></label>
    <label class="check"><input type="checkbox" name="public"><span data-series-text="公开使用，允许其他会话检索这张图">公开使用，允许其他会话检索这张图</span></label>
    <p class="hint" data-series-text="不勾选时，仅原生成会话可使用。没有会话来源的创作台图片，需要明确选择公开收藏。">不勾选时，仅原生成会话可使用。没有会话来源的创作台图片，需要明确选择公开收藏。</p>
    <footer>
      <button type="button" data-close="save-dialog" data-series-text="取消">取消</button>
      <button class="primary" type="submit" data-series-text="收藏到表情库">收藏到表情库</button>
    </footer>
  </form>
</dialog>
<dialog id="generate-dialog" aria-labelledby="generate-dialog-title">
  <form id="generate-form">
    <div class="dialog-head">
      <h2 id="generate-dialog-title" data-series-text="角色创作">角色创作</h2>
      <button type="button" data-close="generate-dialog" aria-label="关闭" data-series-aria-label="关闭">×</button>
    </div>
    <input type="hidden" name="character">
    <label><span data-series-text="画面描述">画面描述</span><textarea name="prompt" rows="4" required maxlength="4000" placeholder="描述场景、动作或表情，角色外观和画风会自动带入" data-series-placeholder="描述场景、动作或表情，角色外观和画风会自动带入"></textarea></label>
    <footer>
      <button type="button" data-close="generate-dialog" data-series-text="取消">取消</button>
      <button class="primary" type="submit" data-series-text="生成图片">生成图片</button>
    </footer>
  </form>
</dialog>
<script src="shared/references.js"></script>
<script src="shared/tasks.js"></script>
<script type="module" src="workshop.js?v=world.2"></script>
</body>
</html>
