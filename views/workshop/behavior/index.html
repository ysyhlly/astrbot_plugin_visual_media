<header class="hero series-heading"><div><div class="eyebrow">VISUAL MEDIA / ACTIVITY</div><h1 data-series-text="表达与记录">表达与记录</h1><p data-series-text="查看成员偏好、媒体选择与真实交付，核对角色形象。">查看成员偏好、媒体选择与真实交付，核对角色形象。</p></div><button id="refresh" data-series-text="刷新记录">刷新记录</button></header><section id="dynamics-series-panel" aria-label="互通插件状态" data-series-aria-label="互通插件状态"><p class="sp-feedback" role="status" data-series-text="正在读取互通插件…">正在读取互通插件…</p></section>
<div id="notice" role="status" aria-live="polite"></div>
<section><h2 data-series-text="当前策略">当前策略</h2><p id="policy" role="status" data-series-text="正在读取配置…">正在读取配置…</p><p class="hint" data-series-text="可在 AstrBot 的插件配置 → 媒体行为与角色核对中调整。关闭角色核对可减少一次视觉模型调用。">可在 AstrBot 的插件配置 → 媒体行为与角色核对中调整。关闭角色核对可减少一次视觉模型调用。</p></section>
<section><div class="section-head"><div><h2 data-series-text="表达偏好">表达偏好</h2><p data-series-text="按会话及成员分别保存。可直接对安安说“以后少发表情”“我喜欢水彩画风”“这张别再发了”。">按会话及成员分别保存。可直接对安安说“以后少发表情”“我喜欢水彩画风”“这张别再发了”。</p></div></div><div id="preferences" class="preference-grid"></div></section>
